temporal:
  url: "resilmesh-sop-wo-temporal:7233"
  namespace: default
  easm_task_queue: easm
  nmap_task_queue: nmap
  cve_connector_task_queue: cve_connector
  slp_enrichment_task_queue: slp_enrichment
  shared_task_queue: shared

neo4j:
  password: supertestovaciheslo
  bolt: bolt://resilmesh-sap-neo4j:7687
  user: neo4j

redis:
  host: resilmesh-redis
  port: 6379
  db: 3

isim_urls:
  rest_url: "http://resilmesh-sap-isim:8000"
  risk_url: "http://resilmesh-sap-isim-automation:5000"
  graphql_url: "http://resilmesh-sap-isim-graphql:4001/graphql"

nmap_basic:
  targets:
    - resilmesh-sap-casm-metasploitable3
  arguments: "-sV -A"

nmap_topology:
  targets:
    - resilmesh-sap-casm-metasploitable3
  arguments: "-sn -n --traceroute"

easm_scanner:
  domains:
    - vulnweb.com
  mode: fast  # fast or complete
  httpx_path: "/app/go/bin/httpx"
  threads: 100   # required only for complete mode
  wordlist_path: "/app/temporal/easm/subdomainwordlist.txt"  # required only for complete mode

slp_enrichment:
  x_api_key: ""

cve_connector:
  nvd_api_key: ""

logging:
  level: INFO
  pretty_print_exceptions: False
  formatter: json
  verbose_origin: True
