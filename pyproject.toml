[project]
name = "easyeasm-demo"
version = "0.1.0"
description = ""
authors = [
    {name = "Michal Čech", email = "445431@mail.muni.cz"}
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "temporalio>=1.8.0,<2.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "dacite>=1.8.1,<2.0.0",
    "neo4j>=5.25.0,<6.0.0",
    "validators>=0.34.0,<0.35.0",
    "structlog>=24.4.0,<25.0.0",
    "httpx[http2]>=0.27.0",
    "valkey>=6.1.1,<7.0.0",
    "msgspec>=0.19.0",
]

[dependency-groups]
dev = [
    "ruff>=0.0.261",
    "pyright>=1.1.382,<1.1.399",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest>=9.0.1,<10.0.0",
    "syrupy>=5.0.0,<6.0.0",
]

cve-connector = [
    "certifi==2024.8.30",
    "charset-normalizer==3.3.2",
    "idna==3.10",
    "pytz==2024.2",
    "requests==2.32.3",
    "setuptools==75.1.0",
    "urllib3==2.2.3",
    "packaging==25.0",
]

nmap = [
    "python3-nmap (==1.9.1)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

########## POETRY ##########
[tool.poetry]
requires-poetry = ">=2.0.0,<3.0.0"

########## RUFF ##########
[tool.ruff]
line-length = 120
target-version = "py312"

extend-exclude = ["typings"]

[tool.ruff.lint]
preview = true
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
    "C90", # mccabe complexity
    "N", # pep8-naming
    "UP", # pyupdate
    "ANN", # annotations
    "ASYNC", # async
    "S", # sus stuff
    "BLE", # Blind exceptions
    "ERA", # commented out code
    "B", # Commonly missused ~ wierd behavior
    "C4", # Comprehensions
    "DTZ", # Dont use drunk datetime stuff
    "INP", # Implicit namespacing alerts
    "PIE", # Common unnecessary operations with bultins
    "T20", # Prints
    "PYI", # Stubs
    "PT", # pytest
    "Q", # Double quotes
    "RET", # Returns
    "SLF", # Private member access
    "SIM", # Simplifications
    "TCH", # Type Checking
    "ARG", # Unused arguments
    "PTH", # Pathlib
    "TRY201", # Use raise without specifying exception name
    "TRY301", # Raise within try
    "TRY203", # Useless try-except
    "TRY400", # Replace logger.error with logger.exception when logging exceptions
    "FLY002", # Use f strings instead of static joins
    "PERF101", # Unnecessary list-cast
    "PERF102", # Incorrect dict iterator
    "PERF402", # Manual list copy
    "FURB", # Refurb
    "RUF", # Ruf Extras
]
ignore = [
    "D",  # Docs, not used
    "DOC",  # Docs, not used
    "CPY",  # Copyright, not used
    "PERF",  # Micro-optimizations, IMO sacrifices a lot of readability for minor improvements.
    "ANN201", # cls type anntation
    "ANN401", # disallowing any type
    "PLR6301",  # Method could be a function, class method, or static method -- a lot of FP in tests, not worth it.
    "PLR0917",  # Too many positional arguments
    "PLR0913",  # Too many arguments in function
    "PT006",  # Wrong type passed to first argument of `pytest.mark.parametrize`; expected `tuple`
    "FIX002",  # Line contains todo,
    "TRY003",  # Long exception declared outside exception class
    "COM812",  # Conflicting with formatter
    "PLR2004",  # Magic value in comparison
    "PERF401",  # Rewrite loop with append as list.extend
    "FBT001", # Boolean as a positional argument -- MIGHT FIX
    "FBT002", # Boolean default -- MIGHT FIX
    "FBT003", # Boolean positional in function call -- MIGHT FIX
    "PLR0914", # Too many local variables
    "TRY300", # Returns ouside try block, imo weird
    "C417",  # Maps are not unnecessary
    "C416",  # Set comprehension - IMO broken
    "TID252",  # Imports - TODO(all)
    "SIM108",  # Forced Ternaries not always good
    "PLR0402",  # Use direct import in lieu of alias -- breaks module imports in certain situations
    "G004",  # Use of f-strings in log statements -- MIGHT FIX
    # Rules conflicting with the formatter - https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "E501",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"test/*" = [
    "PLR0911",  # Too many return statements
    "A002",  # Shadowing built-in
]
"tests/*" = [
    "PLR0911",  # Too many return statements
    "A002",  # Shadowing built-in
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pycodestyle]
max-line-length = 200

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
"test/**/*.py" = [
    "S101", # asserts allowed in tests...
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "PLR2004", # Magic value used in comparison,...
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
    "RUF029", # Function is declared async but doesn't await
    "BLE001", # Don't catch blind exception
    "SLF001", # Private member access
    "PT011", # pytest.raises too broad
    "E501", # Line too long
    "S608", # SQL Injection
    "S106", # Hardcoded password
    "T201", # Print
    "S108", # Probable insecure usage of temporary file or directory
    "EM101", # Properly formatted exceptions
]
"tests/**/*.py" = [
    # at least this three should be fine in tests:
    "S101", # asserts allowed in tests...
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    # The below are debateable
    "PLR2004", # Magic value used in comparison,...
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
    "RUF029", # Function is declared async but doesn't await
    "BLE001", # Don't catch blind exception
    "SLF001", # Private member access
    "PT011", # pytest.raises too broad
    "E501", # Line too long
    "S608", # SQL Injection
    "S106", # Hardcoded password
    "T201", # Print
    "S108", # Probable insecure usage of temporary file or directory
    "EM101", # Properly formatted exceptions
]


########## PYRIGHT ##########
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingImports = true
reportImportCycles = true
reportMissingTypeStubs = true
reportMissingModuleSource = false
venvPath = "."
venv = ".venv"
exclude = [
    "**/__pycache__","**/.*",
    ".venv/",
    "typings/"
]
