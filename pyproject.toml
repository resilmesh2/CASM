[project]
name = "easyeasm-demo"
version = "0.1.0"
description = ""
authors = [
    {name = "Michal Čech", email = "445431@mail.muni.cz"}
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "temporalio>=1.8.0,<2.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "dacite>=1.8.1,<2.0.0",
    "neo4j>=5.25.0,<6.0.0",
    "validators>=0.34.0,<0.35.0",
    "structlog>=24.4.0,<25.0.0",
    "httpx>=0.28.1,<0.29.0",
    "valkey>=6.1.1,<7.0.0",
    "msgspec>=0.19.0",
]

[dependency-groups]
dev = [
    "ruff>=0.0.261",
    "pyright>=1.1.382,<1.1.399",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest>=9.0.1,<10.0.0",
    "syrupy>=5.0.0,<6.0.0",
]

cve-connector = [
    "certifi==2024.8.30",
    "charset-normalizer==3.3.2",
    "idna==3.10",
    "pytz==2024.2",
    "requests==2.32.3",
    "setuptools==75.1.0",
    "urllib3==2.2.3",
    "packaging==25.0",
]

nmap = [
    "python3-nmap (==1.9.1)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

########## POETRY ##########
[tool.poetry]
requires-poetry = ">=2.0.0,<3.0.0"

########## RUFF ##########
[tool.ruff]
line-length = 120
target-version = "py312"

extend-exclude = ["typings"]

[tool.ruff.lint]
preview = true
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
    "C90", # mccabe complexity
    "N", # pep8-naming
    "UP", # pyupdate
    "ANN", # annotations
    "ASYNC", # async
    "S", # sus stuff
    "BLE", # Blind exceptions
    "ERA", # commented out code
    "B", # Commonly missused ~ wierd behavior
    "C4", # Comprehensions
    "DTZ", # Dont use drunk datetime stuff
    "INP", # Implicit namespacing alerts
    "PIE", # Common unnecessary operations with bultins
    "T20", # Prints
    "PYI", # Stubs
    "PT", # pytest
    "Q", # Double quotes
    "RET", # Returns
    "SLF", # Private member access
    "SIM", # Simplifications
    "TCH", # Type Checking
    "ARG", # Unused arguments
    "PTH", # Pathlib
    "TRY201", # Use raise without specifying exception name
    "TRY301", # Raise within try
    "TRY203", # Useless try-except
    "TRY400", # Replace logger.error with logger.exception when logging exceptions
    "FLY002", # Use f strings instead of static joins
    "PERF101", # Unnecessary list-cast
    "PERF102", # Incorrect dict iterator
    "PERF402", # Manual list copy
    "FURB", # Refurb
    "RUF", # Ruf Extras
]
ignore = ["ANN101","ANN102","ANN401"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pycodestyle]
max-line-length = 200

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101","ARG","FBT","SLF001"]

########## PYRIGHT ##########
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingImports = true
reportImportCycles = true
reportMissingTypeStubs = true
reportMissingModuleSource = false
venvPath = "."
venv = ".venv"
exclude = [
    "**/__pycache__","**/.*",
    ".venv/",
    "typings/"
]
