#      SSH: yes
#      SQL: yes
#    networks:
#      resilmesh_network:

  resilmesh_sap_wo_redis:
    container_name: resilmesh_sap_wo_redis
    image: redis:7.0-alpine
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - resilmesh_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  resilmesh_sap_wo_component_scheduler:
    container_name: resilmesh_sap_wo_component_scheduler
    build:
      context: .
      network: host
      dockerfile: Dockerfile
    command: ["/venv/bin/python", "/app/component_worker.py"]
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ../ISIM/config:/config:ro
    depends_on:
      resilmesh_sap_wo_temporal:
        condition: service_healthy
    networks:
      - resilmesh_network
    environment:
      - TEMPORAL_HOST=resilmesh_sap_wo_temporal
      - TEMPORAL_PORT=7233
      - TEMPORAL_NAMESPACE=default
      - RISK_API_URL=http://resilmesh_sap_isim_automation:5000
      - NEO4J_URI=bolt://resilmesh_sap_isim_neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=supertestovaciheslo

  resilmesh_sap_wo_nmap:
    container_name: resilmesh_sap_wo_nmap
    build:
      dockerfile: nmap.Dockerfile
      network: host
    restart: unless-stopped
    volumes:
      - ./docker/config.yaml:/app/config/config.yaml
    depends_on:
      resilmesh_sap_wo_temporal:
        condition: service_healthy
    networks:
      - resilmesh_network
    environment:
      - NVD_KEY
      - TEMPORAL_HOST=resilmesh_sap_wo_temporal
      - TEMPORAL_PORT=7233
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=supertestovaciheslo
      - NEO4J_BOLT=bolt://resilmesh_sap_isim_neo4j:7687

  resilmesh_sap_wo_cve_connector:
    container_name: resilmesh_sap_wo_cve_connector
    build:
      dockerfile: cve-connector.Dockerfile
      network: host
    restart: unless-stopped
    volumes:
      - ./docker/config.yaml:/app/config/config.yaml
    depends_on:
      resilmesh_sap_wo_temporal:
        condition: service_healthy
    networks:
      - resilmesh_network
    environment:
      - NVD_KEY
      - TEMPORAL_HOST=resilmesh_sap_wo_temporal
      - TEMPORAL_PORT=7233
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=supertestovaciheslo
      - NEO4J_BOLT=bolt://resilmesh_sap_isim_neo4j:7687

volumes:
  resilmesh_sap_wo_neo4j_data:

networks:
  resilmesh_network:
    external: true