  redis:
    image: docker.io/redis:7
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - resilmesh_network

  nmap-worker:
    build:
      dockerfile: nmap.Dockerfile
    container_name: nmap-worker
    restart: unless-stopped
    volumes:
      - ./docker/config.yaml:/app/config/config.yaml
    networks:
      - resilmesh_network
    environment:
      - TEMPORAL_HOST=temporal
      - TEMPORAL_PORT=7233
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=supertestovaciheslo
      - NEO4J_BOLT=bolt://neo4j:7687

  cve-connector-worker:
    build:
      dockerfile: cve-connector.Dockerfile
    container_name: cve-connector
    restart: unless-stopped
    volumes:
      - ./docker/config.yaml:/app/config/config.yaml
#    depends_on:
#      neo4j:
    networks:
      - resilmesh_network
    environment:
      - TEMPORAL_HOST=temporal
      - TEMPORAL_PORT=7233
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=supertestovaciheslo
      - NEO4J_BOLT=bolt://neo4j:7687

  slp-enrichment-worker:
    build:
      dockerfile: slp_enrichment.Dockerfile
    container_name: slp-enrichment
    restart: unless-stopped
    volumes:
      - ./docker/config.yaml:/app/config/config.yaml
    networks:
      - resilmesh_network
    environment:
      - TEMPORAL_HOST=temporal
      - TEMPORAL_PORT=7233

