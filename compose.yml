  resilmesh-sap-casm-component-scheduler-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resilmesh-sap-casm-component-scheduler-worker
    command: ["/venv/bin/python", "/app/component_worker.py"]
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ../ISIM/config:/config:ro  # Mount ISIM's config as read-only
#    depends_on:
#      resilmesh-sop-wo-temporal:
#        condition: service_healthy
    networks:
      - resilmesh_network
    environment:
      - TEMPORAL_HOST=resilmesh-sop-wo-temporal
      - TEMPORAL_PORT=7233
      - TEMPORAL_NAMESPACE=default
      - RISK_API_URL=http://resilmesh-sap-isim-automation:5000
      - NEO4J_URI=bolt://resilmesh-sap-isim-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=supertestovaciheslo

  resilmesh-sap-casm-nmap-worker:
