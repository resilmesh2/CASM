services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_DB: amass
      PG_DATA: /data/postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./postgresql/install_extensions.sql:/docker-entrypoint-initdb.d/install_extensions.sql
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - resilmesh_network

  worker:
    build: .
    restart: unless-stopped
    volumes:
      - ./docker/config.yaml:/app/config/config.yaml
      - ./docker/amass_config.yaml:/app/.config/amass/config.yaml
    networks:
      - resilmesh_network

