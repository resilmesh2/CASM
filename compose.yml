services:
  resilmesh-sap-casm-postgres:
    container_name: resilmesh-sap-casm-postgres
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: resilmesh-sap-casm-postgres
      POSTGRES_DB: amass
      PG_DATA: /data/postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./postgresql/install_extensions.sql:/docker-entrypoint-initdb.d/install_extensions.sql
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - resilmesh_network

  resilmesh-sap-casm-component-calculation-worker:
    container_name: resilmesh-sap-casm-component-calculation-worker
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./docker/config.yaml:/app/config/config.yaml
      - ./docker/amass_config.yaml:/app/.config/amass/config.yaml
#    depends_on:
#      resilmesh-sop-wo-temporal:
#        condition: service_healthy
    networks:
      - resilmesh_network

  resilmesh-sap-casm-worker:
    container_name: resilmesh-sap-casm-easm-worker
    build: .
    restart: unless-stopped
    volumes:
      - ./docker/config.yaml:/app/config/config.yaml
      - ./docker/amass_config.yaml:/app/.config/amass/config.yaml
#    depends_on:
#      resilmesh-sop-wo-temporal:
#        condition: service_healthy
    networks:
      - resilmesh_network

  resilmesh-sap-casm-metasploitable3:
    container_name: resilmesh-sap-casm-metasploitable3
    image: kirscht/metasploitable3-ub1404
    # use environment variables to set password, enable root and start services
    entrypoint: /entrypoint.sh
    environment:
      PASS: myPass
      ROOT: yes
      CUPS: yes
      FTP: yes
      HTTP: yes
      IRC: yes
      SMB: yes
      SSH: yes
      SQL: yes
    networks:
      - resilmesh_network


